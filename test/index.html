<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BootSideMenu</title>
    <link rel="stylesheet" href="../node_modules/qunit/qunit/qunit.css" />
    <!-- the shipped stylesheet, so that the layout tests measure real rules -->
    <link rel="stylesheet" href="../dist/BootSideMenu.css" />
    <style>
      /* The menu is position: fixed, which would otherwise escape the
         off-screen fixture and cover the QUnit report. */
      #qunit-fixture {
        transform: translateZ(0);
      }
    </style>
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="test"></div>
    </div>
    <script src="../node_modules/qunit/qunit/qunit.js"></script>
    <!-- served by test/middleware.mjs; see the comment there -->
    <script src="vendor/jquery.js"></script>
    <script src="../dist/BootSideMenu.min.js"></script>
    <script src="tests.js"></script>
  </body>
</html>
